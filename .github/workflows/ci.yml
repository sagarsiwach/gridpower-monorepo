name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
      - run: flutter pub get
        working-directory: apps/energy_app
      - run: flutter analyze && flutter test
        working-directory: apps/energy_app
      - run: flutter pub get
        working-directory: apps/charge_app
      - run: flutter analyze && flutter test
        working-directory: apps/charge_app
